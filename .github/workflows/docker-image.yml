name: Docker Image CI

on:
  push:
    branches: [ "feat/filemanager" ]
  pull_request:
    branches: [ "feat/filemanager" ]
  workflow_dispatch: # Ajouté pour pouvoir le lancer manuellement aussi

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 1. Permissions indispensables pour écrire dans GHCR
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    # 2. Connexion indispensable à ghcr.io
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 3. Construction avec le bon nommage ghcr.io (en minuscules)
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/akas-ia/filemanager-secu:v1.0.7

    # 4. Envoi effectif sur le registre GitHub
    - name: Push the Docker image
      run: docker push ghcr.io/akas-ia/filemanager-secu:v1.0.7